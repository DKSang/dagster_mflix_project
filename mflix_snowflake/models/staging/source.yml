version: 2
sources:
  - name: raw
    database: dagster_db
    schema: mflix
    tables:
      - name: comments
        meta:
          dagster:
            description: "This table contains all the comments made by users on movies."
            asset_key: [dlt_mongodb_comments]
      - name: embedded_movies
        meta:
          dagster:
            description: "This table contains all the movie details, including embedded fields for genres, countries, cast, directors, writers, and languages."
            asset_key: [dlt_mongodb_embedded_movies]
      - name: embedded_movies__genres
        meta:
          dagster:
            description: "This table contains the genres associated with each movie, extracted from the embedded_movies table."
      - name: embedded_movies__countries
        meta:
          dagster:
            description: "This table contains the countries associated with each movie, extracted from the embedded_movies table."
      - name: embedded_movies__cast
        meta:
          dagster:
            description: "This table contains the cast members associated with each movie, extracted from the embedded_movies table."
      - name: embedded_movies__directors
        meta:
          dagster:
            description: "This table contains the directors associated with each movie, extracted from the embedded_movies table."
      - name: embedded_movies__writers
        meta:
          dagster:
            description: "This table contains the writers associated with each movie, extracted from the embedded_movies table."
      - name: embedded_movies__languages
        meta:
          dagster:
            description: "This table contains the languages associated with each movie, extracted from the embedded_movies table."
