# Soda Checks for Staging Layer
# Validates transformed raw data in staging zone

checks for stg_comments:
  - row_count > 0:
      name: "Staging comments table has data"
  - row_count >= 100:
      name: "Staging comments table has at least 100 records"
  - missing_count(comment_id) = 0:
      name: "No null comment_id in staging"
  - missing_count(movie_id) = 0:
      name: "No null movie_id in staging comments"
  - missing_count(comment_text) = 0:
      name: "No null comment text"
  - missing_count(comment_date) = 0:
      name: "No null comment_date"
  - duplicate_count(comment_id) = 0:
      name: "No duplicate comments"
  - invalid_count(comment_date) = 0:
      valid_format: "date"
      name: "All comment dates are valid"

checks for stg_embedded_movies:
  - row_count > 0:
      name: "Staging embedded movies table has data"
  - missing_count(_id) = 0:
      name: "No null _id in staging movies"
  - missing_count(title) = 0:
      name: "No null title in staging movies"
  - invalid_count(year) = 0:
      valid_format: "number"
      name: "All years are numeric in staging"
  - invalid_range(year) = 0:
      valid_min: 1900
      valid_max: 2099
      name: "All years are in valid range"

checks for stg_movie_cast:
  - row_count > 0:
