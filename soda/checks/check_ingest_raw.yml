# Soda Checks for Raw Ingestion Layer (MongoDB sources)
# Validates data quality right after ingestion from raw zone

checks for comments:
  - row_count > 0:
      name: "Raw comments table has data"
  - missing_count(movie_id) = 0:
      name: "No null movie_id in comments"
  - missing_count(date) = 0:
      name: "No null date in comments"
  - duplicate_count(movie_id, _id) = 0:
      name: "No duplicate comment records"

checks for embedded_movies:
  - row_count > 0:
      name: "Raw embedded_movies table has data"
  - missing_count(_id) = 0:
      name: "No null _id in embedded_movies"
  - missing_count(title) = 0:
      name: "No null title in embedded_movies"

checks for embedded_movies__genres:
  - row_count > 0:
      name: "Raw genres table has data"
  - missing_count(_dlt_parent_id) = 0:
      name: "No null parent movie id in genres"
  - missing_count(value) = 0:
      name: "No null genre values"

