# Soda Checks for Transform/Intermediate Layer
# Validates business logic transformations and dimensional/fact prep

checks for int_movie_flattened:
  - row_count > 0:
      name: "Intermediate movies table has data"
  - missing_count(movie_id) = 0:
      name: "No null movie_id in intermediate"
  - missing_count(title) = 0:
      name: "No null title in intermediate movies"
  - duplicate_count(movie_id) = 0:
      name: "No duplicate movies in intermediate"
  - invalid_count(imdb_rating) = 0:
      valid_format: "number"
      name: "All IMDB ratings are numeric"
  - invalid_range(imdb_rating) = 0:
      valid_min: 0
      valid_max: 10
      name: "IMDB ratings in valid range (0-10)"
  - invalid_count(imdb_votes) = 0:
      valid_format: "number"
      name: "All IMDB vote counts are numeric"
  - invalid_range(imdb_votes) = 0:
      valid_min: 0
      valid_max: 9999999
      name: "IMDB vote counts are non-negative"

